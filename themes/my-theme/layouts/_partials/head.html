<!DOCTYPE html>
<meta charset="UTF-8">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Programming, Linux, networking and random things I find interesting.">
<meta name="keywords" content="Bravecake, programming, linux, blog">
<meta name="author" content="Bravecake">

<meta property="og:type" content="website">
<meta property="og:title" content="Bravecake's Blog">
<meta property="og:description" content="Programming, Linux, networking and random discoveries.">

{{ with resources.Get "styles.css" }}
  {{ $style := . | resources.Minify | fingerprint }}

{{ end }}
